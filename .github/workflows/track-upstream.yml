name: Track upstream localization
on:
  schedule:
    - cron: '17 */6 * * *' # Every six hours; GitHub may delay scheduled jobs.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: track-upstream
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'KATOUIV/claude-desktop-zh-cn'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: katou/windows-compat
          persist-credentials: false
      - name: Sync mirror, official release and review proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python maintenance/track_upstream.py --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --report "$RUNNER_TEMP/upstream-tracking.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Retain sanitized tracking metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-tracking
          path: ${{ runner.temp }}/upstream-tracking.json
          retention-days: 14
          if-no-files-found: warn
